name: Keep-alive

# Render's free plan stops a service after ~15 minutes without traffic, which
# also stops the trading loop. This workflow pings the bot's health endpoint
# every 5 minutes from GitHub's scheduler, which costs nothing on a public repo.
#
# Where the URL comes from, in order:
#   1. the repository variable BOT_URL
#      (Settings > Secrets and variables > Actions > Variables), else
#   2. the first non-comment line of deploy/bot-url.txt, which ships filled in.
#
# So it works out of the box; the variable is only needed when you deploy
# somewhere else and would rather not commit the URL.
#
# Caveats worth knowing:
#   - GitHub cron is best effort; runs can be delayed by several minutes. A
#     5-minute cadence leaves room for that, but it is not a hard guarantee.
#   - GitHub disables scheduled workflows after ~60 days without repository
#     activity. Any push re-enables it.
#   - This keeps the PROCESS alive; it does not make Render's free plan a
#     supported 24/7 host. For that, see docs/FREE_HOSTING.md.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /healthz
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          sparse-checkout-cone-mode: false

      - name: Resolve the bot URL
        id: target
        env:
          BOT_URL: ${{ vars.BOT_URL }}
        run: |
          set -eu
          url="${BOT_URL:-}"
          if [ -z "${url}" ] && [ -f deploy/bot-url.txt ]; then
            url="$(grep -v '^[[:space:]]*#' deploy/bot-url.txt | grep -v '^[[:space:]]*$' | head -1 | tr -d '[:space:]')"
          fi
          if [ -z "${url}" ]; then
            echo "::notice::No bot URL. Set the repository variable BOT_URL or fill in deploy/bot-url.txt. Skipping."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "Pinging ${url%/}/healthz"

      - name: Wake the bot
        if: steps.target.outputs.url != ''
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          set -u
          for attempt in 1 2 3 4; do
            if body=$(curl -fsS --max-time 30 "${URL}/healthz"); then
              echo "OK (attempt ${attempt}): ${body}"
              exit 0
            fi
            echo "attempt ${attempt} failed; a cold start can take ~60s"
            sleep 20
          done

          echo "::error::Could not reach ${URL}/healthz after 4 attempts. Check the Render service and the deploy/bot-url.txt value."
          exit 1
