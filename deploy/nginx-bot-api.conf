# Optional: expose the read-only bot status API through the nginx that already
# serves your EC2 dashboard. The API itself stays bound to 127.0.0.1.
#
# Add inside the existing server { ... } block that serves your dashboard.
# Then request https://<your-domain>/bot-api/status from the dashboard JS.
#
# The trailing slashes matter: /bot-api/status -> http://127.0.0.1:8099/status
# would be wrong, so this location keeps the "/api" prefix instead.

location /bot-api/ {
    # If DASHBOARD_TOKEN is set in .env, uncomment and set the same value:
    # proxy_set_header Authorization "Bearer REPLACE_WITH_TOKEN";

    proxy_pass http://127.0.0.1:8099/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;

    # The status payload is read-only; keep it out of caches.
    add_header Cache-Control "no-store" always;

    # Only GET/HEAD are useful here.
    limit_except GET {
        deny all;
    }
}
