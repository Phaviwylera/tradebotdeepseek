# Optional nginx front door for the read-only status API / console.
#
# Two supported shapes:
#
#  A) Serve the whole console from the bot on its own hostname:
#
#       server {
#           listen 443 ssl http2;
#           server_name bot.example.com;
#           include snippets/ssl.conf;
#           location / { proxy_pass http://127.0.0.1:8099; include snippets/proxy.conf; }
#       }
#
#  B) Mount the console under a path on an existing dashboard host (below).
#     Then fetch https://<your-domain>/bot-api/status from your JS. Same origin,
#     so no CORS change is needed.
#
# The bot itself stays bound to the host loopback; nginx is the only public
# listener. The trailing slash in proxy_pass matters: /bot-api/status ->
# http://127.0.0.1:8099/api/status.

location /bot-api/ {
    # If DASHBOARD_TOKEN is set in .env, uncomment and set the same value. This
    # keeps the bearer token server-side so the browser never holds it:
    # proxy_set_header Authorization "Bearer REPLACE_WITH_TOKEN";

    proxy_pass http://127.0.0.1:8099/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;

    # The status payload is read-only; keep it out of caches.
    add_header Cache-Control "no-store" always;

    # Only GET/HEAD are useful here.
    limit_except GET {
        deny all;
    }
}
