# Render Blueprint — ONE free Web Service runs the bot AND serves the console.
#
#   New > Blueprint > pick this repository > Apply
#
# Why a web service and not a worker: the bot serves its own read-only status
# API and the static dashboard on $PORT (see web.py), so a single service is
# enough. Background workers are paid-only on Render; web services have a free
# plan. This file is configured for that free plan ($0, no card required).
#
# Three things the free plan changes, all handled here:
#
#   1. Instances SPIN DOWN after ~15 minutes without traffic. A spin-down stops
#      the trading loop. The repo ships .github/workflows/keepalive.yml, which
#      pings /healthz every 5 minutes from GitHub Actions (free for public
#      repos). Set the repository variable BOT_URL to this service's URL and the
#      loop stays up. A cron job is best-effort, so treat it as "mostly awake".
#
#   2. There is NO persistent disk, so the ledger lives in /tmp and is lost on
#      every deploy or restart. Signals and orders still stream to the console
#      while the process lives. If you need long-term audit history, upgrade to
#      the Starter plan and use deploy/render-starter.yaml, which adds a 1 GB
#      disk at /var/data.
#
#   3. Free instances have 512 MB of RAM and 0.1 CPU. MAX_MARKETS_PER_CYCLE is
#      kept low so the book-fetch fan-out stays comfortable.
#
# Safety: LIVE stays "false". Nothing is submitted until you deliberately add
# POLYGON_PRIVATE_KEY and flip LIVE in the dashboard.

services:
  - type: web
    name: polymarket-calibrated-bot
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LIVE
        value: "false"
      - key: BANKROLL
        value: "200"
      - key: MAX_BET
        value: "20"
      # Ephemeral: survives restarts only within the same instance.
      - key: LEDGER_PATH
        value: /tmp/ledger.db
      - key: MODEL_PATH
        value: /tmp/model.joblib
      - key: API_HOST
        value: 0.0.0.0
      - key: SERVE_DASHBOARD
        value: "true"
      # Render generates the bearer token on first apply. Read it under
      # Environment to unlock a token-protected console.
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: SCAN_INTERVAL_SECONDS
        value: "60"
      - key: MAX_MARKETS_PER_CYCLE
        value: "20"
      # --- widened signal gates (an explicit, reversible choice) -------------
      # The defaults (MIN_EV=0.02, SNIPE_MIN_ASK=0.93) produce a snipe band of
      # [0.9300, 0.9314) -- 0.14 cents wide. That is honest but almost never
      # trades, so this deployment opts into a wider band:
      #   MIN_EV=0.01        -> EV cap 0.95 / 1.01 = 0.9406
      #   SNIPE_MIN_ASK=0.90 -> band [0.9000, 0.9406), ~4 cents
      # Cost of widening: the 0.95 hold assumption is now applied to markets
      # priced as low as 0.90, where it is least reliable. Signals are still
      # DRY-RUN records only. Delete these two keys to restore the strict band.
      - key: MIN_EV
        value: "0.01"
      - key: SNIPE_MIN_ASK
        value: "0.90"
      # --- quant lanes ------------------------------------------------------
      # Quarter Kelly on model-edge signals. Lower it if the model's probability
      # estimate is worse than you think; it almost certainly is.
      - key: KELLY_FRACTION
        value: "0.25"
      # Resolution risk. A market whose rules admit a 50-50 fallback can settle at
      # $0.50 a share, which is a 47% loss on a 0.94 entry. Charging 2% for that
      # pulls a 0.95 hold down to 0.941 and the band cap from 0.9406 to 0.9317.
      # Markets that declare equal_split are skipped entirely rather than priced.
      - key: NA_PROBABILITY
        value: "0.02"
      - key: REQUIRE_UNAMBIGUOUS_RESOLUTION
        value: "true"
      # NegRisk basket parity: buy all M outcomes of an event when the complete
      # basket costs < 1.00 after per-leg taker fees. Signals only -- the
      # executor cannot yet submit M legs as one risk-free basket.
      - key: NEGRISK_ENABLED
        value: "true"
      - key: NEGRISK_MAX_EVENTS
        value: "2"
      - key: NEGRISK_MIN_PROFIT
        value: "0.005"
      - key: LOG_LEVEL
        value: INFO
      - key: POLYGON_PRIVATE_KEY
        sync: false
      - key: POLYMARKET_SIGNATURE_TYPE
        value: "0"
      - key: POLYMARKET_FUNDER
        sync: false
